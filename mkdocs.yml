site_name: Bridge Classification
site_description: USGS LiDAR Bridge Point Cloud Classification Pipeline
repo_url: https://github.com/NGWPC/bridge-classification
repo_name: NGWPC/bridge-classification
edit_uri: edit/main/docs/

extra:
  version:
    provider: mike

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.code.copy
    - content.tooltips
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Guide:
    - Architecture: architecture.md
    - Data Pipeline: data-pipeline.md
    - AWS Batch Inference: aws-batch-inference.md
    - Deployment Runbook: deployment-runbook.md
    - Design Decisions: decisions.md
  - API Reference:
    - api/index.md
    - Core & Constants: api/core.md
    - Data I/O & Processing: api/data-io.md
    - Weak Supervision: api/weak-supervision.md
    - Model & Training: api/model-training.md
    - Inference & Cloud: api/inference-cloud.md
    - Utility Scripts: api/utils.md
  - Notebooks:
    - Dataset Overview: notebooks/dataset_overview.ipynb
    - RANSAC Deck Planes: notebooks/ransac_deck_planes.ipynb
    - Training Plots: notebooks/training_plots.ipynb

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            heading_level: 2
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            members_order: source
  - mkdocs-jupyter:
      execute: false
      include_source: true

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true
