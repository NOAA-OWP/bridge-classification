services:
  bridge-classifier:
    build:
      context: .
      dockerfile: Dockerfile
    image: bridge-classifier
    working_dir: /app
    volumes:
      - .:/app # Mount code
      - ${DATA_DIR}:${DATA_DIR} # Mount data from .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Optional: help with libstdc++ on some hosts
    environment:
      - MAMBA_DOCKERFILE_ACTIVATE=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - LD_LIBRARY_PATH=/opt/conda/lib:${LD_LIBRARY_PATH:-}
      - PYTHONDONTWRITEBYTECODE=1
    stdin_open: true
    tty: true
    command: ["/bin/bash"]
    # Shared memory for PyTorch/spconv — matches terraform shared_memory_size (4096 MB)
    shm_size: '4gb'
